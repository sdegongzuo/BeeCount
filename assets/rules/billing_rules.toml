# BeeCount billing rules
# Keep this file as one downloadable TOML package.
# Sections are grouped so they can be split into source files later.

# ---------------------------------------------------------------------------
# Package metadata
# ---------------------------------------------------------------------------

schemaVersion = 1
rulePackageVersion = 2
rulesVersion = "2026.07.25.2"
normalizationVersion = 1

# ---------------------------------------------------------------------------
# Payment channel registry
# ---------------------------------------------------------------------------

[[paymentChannels]]
channel = "微信支付"
packages = ["com.tencent.mm"]
appNameKeywords = ["微信"]
confidence = 0.95

[[paymentChannels]]
channel = "支付宝"
packages = ["com.eg.android.AlipayGphone"]
appNameKeywords = ["支付宝"]
confidence = 0.95

[[paymentChannels]]
channel = "抖音"
packages = ["com.ss.android.ugc.aweme"]
appNameKeywords = ["抖音"]
confidence = 0.9

[[paymentChannels]]
channel = "美团"
packages = ["com.sankuai.meituan"]
appNameKeywords = ["美团"]
confidence = 0.9

[[paymentChannels]]
channel = "京东"
packages = ["com.jingdong.app.mall"]
appNameKeywords = ["京东"]
confidence = 0.9

[[paymentChannels]]
channel = "云闪付"
packages = ["com.unionpay"]
appNameKeywords = ["云闪付"]
confidence = 0.9

# ---------------------------------------------------------------------------
# WeChat payment detail templates
# ---------------------------------------------------------------------------

[[templates]]
id = "wechat_payment_detail_v1"
enabled = true
priority = 100
baseConfidence = 0.88

[templates.match]
sourcePackages = ["com.tencent.mm"]
keywordsAll = ["当前状态", "支付时间", "交易单号"]
keywordsAny = [
  "微信支付",
  "支付详情",
  "交易详情",
  "财付通支付科技有限公司",
  "收单机构",
  "商户全称",
]

# Basic fields

[[templates.extract]]
field = "paymentChannel"
type = "constant"
value = "微信支付"
confidence = 0.95

[[templates.extract]]
field = "amount"
type = "regex"
pattern = '^\s*([¥￥]?\s*[-+]?\d{1,6}\.\d{1,2})\s*(?:元)?\s*$'
parser = "signedAmount"
confidence = 0.9

[[templates.extract]]
field = "time"
type = "labelNextLine"
label = "支付时间"
parser = "zhDatetime"
confidence = 0.9

# Counterparty and payment method

[[templates.extract]]
field = "merchantFullName"
type = "labelNextLine"
label = "商户全称"
confidence = 0.85

[[templates.extract]]
field = "acquirer"
type = "labelNextLine"
label = "收单机构"
confidence = 0.8

[[templates.extract]]
field = "paymentMethod"
type = "labelNextLine"
label = "支付方式"
confidence = 0.85

[[templates.extract]]
field = "note"
type = "regex"
pattern = '^(拼多多|天津津门测试餐厅乙)$'
confidence = 0.82

[[templates.extract]]
field = "counterparty"
type = "regex"
pattern = '^(拼多多|天津津门测试餐厅乙)$'
confidence = 0.82

[[templates.extract]]
field = "note"
type = "labelNextLine"
label = "商品"
pattern = '^.{2,40}$'
confidence = 0.84

[[templates.extract]]
field = "counterparty"
type = "labelNextLine"
label = "商品"
pattern = '^.{2,40}$'
confidence = 0.84

# WeChat receipt details

[[templates.extract]]
field = "details.order_amount"
type = "labelNextLine"
label = "原价"
confidence = 0.78

[[templates.extract]]
field = "details.discount"
type = "labelNextLine"
label = "优惠"
confidence = 0.78

# Detail fields

[[templates.extract]]
field = "details.transaction_no"
type = "labelNextLine"
label = "交易单号"
pattern = '\d{20,}'
confidence = 0.9

[[templates.extract]]
field = "details.merchant_order_no"
type = "labelNextLine"
label = "商户单号"
confidence = 0.8

# ---------------------------------------------------------------------------
# Alipay payment detail templates
# ---------------------------------------------------------------------------

[[templates]]
id = "alipay_payment_detail_v1"
enabled = true
priority = 95
baseConfidence = 0.87

[templates.match]
sourcePackages = ["com.eg.android.AlipayGphone"]
keywordsAll = ["账单详情", "支付时间", "付款方式"]
keywordsAny = ["支付宝", "自动扣款成功", "交易详情", "已支付"]

# Basic fields

[[templates.extract]]
field = "paymentChannel"
type = "constant"
value = "支付宝"
confidence = 0.95

[[templates.extract]]
field = "amount"
type = "regex"
pattern = '^\s*([-−]\s*\d{1,6}\.\d{1,2})\s*$'
parser = "signedAmount"
confidence = 0.9

[[templates.extract]]
field = "time"
type = "labelNextLine"
label = "支付时间"
parser = "isoDatetime"
confidence = 0.9

# Counterparty, payment method, and note

[[templates.extract]]
field = "paymentMethod"
type = "labelNextLine"
label = "付款方式"
pattern = '([^>]+)'
confidence = 0.85

[[templates.extract]]
field = "note"
type = "nearKeyword"
label = "交易详情"
pattern = '(ETC服务)'
options = { windowLines = 3 }
confidence = 0.82

[[templates.extract]]
field = "counterparty"
type = "nearKeyword"
label = "交易详情"
pattern = '(ETC服务)'
options = { windowLines = 3 }
confidence = 0.82

[[templates.extract]]
field = "note"
type = "nearKeyword"
label = "交易详情"
pattern = '(冰丝短袖T恤)'
options = { windowLines = 3 }
confidence = 0.8

[[templates.extract]]
field = "counterparty"
type = "regex"
pattern = '^([\u4e00-\u9fa5A-Za-z0-9]{1,16}\*\*店)$'
confidence = 0.78

# Detail fields

[[templates.extract]]
field = "details.route_start"
type = "regex"
pattern = '出发[:：]\s*([^\n]+)'
confidence = 0.8

[[templates.extract]]
field = "details.route_end"
type = "regex"
pattern = '到达[:：]\s*([^\n]+)'
confidence = 0.8

[[templates.extract]]
field = "details.trip_time_range"
type = "regex"
pattern = '(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}至\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})'
confidence = 0.75

[[templates]]
id = "alipay_merchant_payment_detail_v1"
enabled = true
priority = 94
baseConfidence = 0.86

[templates.match]
keywordsAll = ["账单详情", "支付时间"]
keywordsAny = ["支付成功", "商品说明", "订单详情", "商家订单", "付款方式"]

# Basic fields

[[templates.extract]]
field = "paymentChannel"
type = "constant"
value = "支付宝"
confidence = 0.93

[[templates.extract]]
field = "amount"
type = "regex"
pattern = '^\s*([-−]\s*\d{1,6}\.\d{1,2})\s*$'
parser = "signedAmount"
confidence = 0.9

[[templates.extract]]
field = "time"
type = "labelNextLine"
label = "支付时间"
parser = "isoDatetime"
confidence = 0.88

# Counterparty, payment method, and note

[[templates.extract]]
field = "paymentMethod"
type = "labelNextLine"
label = "付款方式"
pattern = '([^>]+)'
confidence = 0.82

[[templates.extract]]
field = "note"
type = "labelNextLine"
label = "商品说明"
pattern = '.*?(猪脚饭).*'
confidence = 0.78

[[templates.extract]]
field = "note"
type = "labelNextLine"
label = "管理自动扣款"
pattern = '.*?(MiMo Token).*'
confidence = 0.82

[[templates.extract]]
field = "counterparty"
type = "regex"
pattern = '^([^\n]{2,40}(?:有限公司|责任公司|股份公司|公司|店|商行))$'
confidence = 0.78

[[templates.extract]]
field = "counterparty"
type = "regex"
pattern = '^(淘宝闪购)$'
confidence = 0.78

